name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint with bandit (SAST)
      run: |
        pip install bandit
        bandit -r src/ -f json -o bandit-report.json || true
      continue-on-error: true
        
    - name: Check dependencies for vulnerabilities (Safety)
      run: |
        pip install safety
        safety check --json > safety-report.json || true
      continue-on-error: true
        
    - name: Run unit tests
      run: |
        pip install pytest pytest-cov
        pytest src/ -v --cov=src/ --cov-report=xml || true
      continue-on-error: true
      
    - name: Build Docker image
      run: |
        docker build -t trading-bot:latest -t trading-bot:${{ github.sha }} .
        
    - name: Run Trivy scan on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'trading-bot:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Display security reports
      if: always()
      run: |
        echo "=== Bandit SAST Report ==="
        cat bandit-report.json || echo "No Bandit report"
        echo ""
        echo "=== Safety Dependency Report ==="
        cat safety-report.json || echo "No Safety report"
